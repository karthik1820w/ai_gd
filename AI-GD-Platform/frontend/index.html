<!doctype html><html lang="en" data-theme="sage"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roundtable — group discussions where everyone gets a turn</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6ede4;--surface:#f4f7f1;--ink:#26332f;--muted:#5d6f69;--line:#cbd8c8;--accent:#3d7a74;--on-accent:#fff;--warm:#ecdcae;--warmline:#c4973f;--tbl:#dce6d8;--avs:34%;--avl:76%}
[data-theme=paper]{--bg:#efe7d4;--surface:#f8f3e6;--ink:#3a3226;--muted:#6f6552;--line:#dccfb2;--accent:#8a5a2b;--warm:#ecd49a;--warmline:#b9772e;--tbl:#e8dcc0;--avs:38%;--avl:76%}
[data-theme=dusk]{--bg:#1c272b;--surface:#26343a;--ink:#e0e9e5;--muted:#9fb2ab;--line:#3a4b51;--accent:#7cc0b4;--on-accent:#10201d;--warm:#5a5230;--warmline:#e0b95c;--tbl:#2d3e44;--avs:26%;--avl:34%}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif;transition:background .3s}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0 0 .5rem}p{margin:0 0 .75rem}
header{display:flex;justify-content:space-between;align-items:center;padding:.9rem 1.5rem;border-bottom:1px solid var(--line)}header b{font:700 1.3rem Fraunces,serif}
select,input{padding:.65rem .8rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;width:100%}
label{color:var(--muted);font-size:.9rem;display:block;margin:.6rem 0 .2rem}
button{font:inherit;font-weight:700;padding:.65rem 1.1rem;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.1rem}.muted{color:var(--muted)}.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
/* home */
.home{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:2rem;align-items:center;max-width:1180px;margin:0 auto;padding:2rem 1.25rem}
.home h1{font-size:clamp(2rem,5vw,3rem)}.tabs{display:flex;gap:.4rem;margin:1.2rem 0 .8rem}.tabs button{background:transparent;color:var(--ink);border-color:var(--line)}.tabs button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.panel{display:none}.panel.on{display:block}
/* table */
.table{--seat:clamp(46px,11.5vw,74px);position:relative;width:min(100%,620px);aspect-ratio:1;margin:0 auto}
.disc{position:absolute;inset:16%;border-radius:50%;background:radial-gradient(circle at 50% 38%,var(--surface),var(--tbl));border:1px solid var(--line);box-shadow:0 0 0 14px color-mix(in srgb,var(--line) 35%,transparent),0 0 0 15px var(--line)}
.core{position:absolute;inset:27%;display:grid;place-items:center;text-align:center}
.core svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.strk{fill:none;stroke:var(--line);stroke-width:3}.sfil{fill:none;stroke:var(--warmline);stroke-width:5;stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset .5s linear}
.core.pulse .sfil{stroke-dashoffset:0;animation:breathe 1.6s ease-in-out infinite}@keyframes breathe{50%{opacity:.35}}
.ctext{position:relative;padding:0 13%}.ctext h2{font-size:clamp(1.05rem,3vw,1.65rem);margin:0 0 .2rem}.ctext p{font-size:clamp(.8rem,2vw,.95rem);color:var(--muted);margin:0}
.seat{position:absolute;transform:translate(-50%,-50%);width:calc(var(--seat) + 30px);display:flex;flex-direction:column;align-items:center;text-align:center}
.av{position:relative;width:var(--seat);height:var(--seat);border-radius:50%;display:grid;place-items:center;font:700 1.1rem Fraunces,serif;background:hsl(var(--h) var(--avs) var(--avl))}
.av svg{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);transform:rotate(-90deg)}
.trk{fill:none;stroke:var(--line);stroke-width:3}.fil{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-dasharray:270.2;stroke-dashoffset:270.2;transition:stroke-dashoffset .5s}
.seat b{font-size:.85rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:.45rem}.seat em{font-style:normal;font-size:.75rem;color:var(--muted)}
.seat.on .av::before,.seat.on .av::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--accent);animation:wave 1.8s ease-out infinite}.seat.on .av::before{animation-delay:.9s}
@keyframes wave{from{transform:scale(1);opacity:.7}to{transform:scale(1.55);opacity:0}}
.seat.inv .av{box-shadow:0 0 0 5px var(--warm);animation:nudge 1.4s ease-in-out infinite}@keyframes nudge{50%{box-shadow:0 0 0 13px color-mix(in srgb,var(--warm) 35%,transparent)}}
.seat.inv em{color:var(--ink);font-weight:700}
/* room */
.shell{display:grid;grid-template-columns:270px minmax(0,1fr) 270px;gap:1rem;max-width:1340px;margin:0 auto;padding:1rem 1.25rem}
.th{display:flex;justify-content:center;gap:.75rem;align-items:center;margin-bottom:1.6rem;text-align:center}.th h1{font-size:clamp(1.2rem,3vw,1.75rem);margin:0}
.pill{font-size:.8rem;padding:.15rem .7rem;border-radius:99px;background:var(--warm);white-space:nowrap}
.code{font:700 2.1rem Fraunces,serif;letter-spacing:.18em}.chips{display:flex;gap:.35rem;flex-wrap:wrap}.chips span{font-size:.8rem;border:1px solid var(--line);padding:.1rem .6rem;border-radius:99px}
.dock{display:flex;gap:.6rem;align-items:center;justify-content:center;margin-top:.8rem}.dock input{max-width:340px}
.mic{width:62px;height:62px;border-radius:50%;padding:0;display:grid;place-items:center}.mic.live{background:var(--warmline);border-color:var(--warmline);color:#1c1a12}
.hint{text-align:center;color:var(--muted);margin:.5rem 0 0}
.feed ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column-reverse;gap:.55rem}.feed li{border-left:3px solid var(--accent);padding-left:.6rem;font-size:.92rem}.feed li b{display:block;font-size:.8rem;color:var(--muted)}
.legend{font-size:.85rem;color:var(--muted)}.stat{display:flex;justify-content:space-between;padding:.25rem 0;border-bottom:1px solid var(--line)}
.rep{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;max-width:1340px;margin:0 auto;padding:0 1.25rem 2rem}
.score{--v:0;position:relative;width:70px;height:70px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--v)*3.6deg),var(--line) 0);display:grid;place-items:center;flex:none}
.score b{width:80%;height:80%;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:700 1.25rem Fraunces,serif}
.meter{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin:.15rem 0 .5rem}.meter i{display:block;height:100%;background:var(--accent)}
.av video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;display:none;background:#000}.av.vid video{display:block}.av.vid span{display:none}
.net{position:absolute;right:0;bottom:0;width:15px;height:15px;border-radius:50%;border:2px solid var(--surface);background:#5aa76b;z-index:2}.net.fair{background:#d9a441}.net.poor{background:#cf5c4b}.net.off{background:#8a8a8a}
.hand{position:absolute;left:-8px;top:-6px;background:var(--warm);border:1px solid var(--warmline);border-radius:99px;padding:0 .4rem;font-size:.85rem;text-decoration:none;z-index:2}.hand:empty{display:none}
.spot{position:absolute;inset:7%;width:86%;height:86%;border-radius:50%;object-fit:cover;display:none;background:#000;border:3px solid var(--accent)}
.core.hasvid{inset:23%}.core.hasvid .spot{display:block}
.core.hasvid .ctext{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);padding:.1rem .9rem;background:var(--surface);border:1px solid var(--line);border-radius:99px;white-space:nowrap}.core.hasvid .ctext p{display:none}.core.hasvid .ctext h2{font-size:1rem;margin:0}
.dock{flex-wrap:wrap}
#toasts{position:fixed;right:1rem;top:4.2rem;display:flex;flex-direction:column;gap:.5rem;z-index:9}.toast{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--warmline);padding:.6rem .9rem;border-radius:10px;max-width:320px;box-shadow:0 4px 14px #0002}
#tr{display:block}.tl{list-style:none;padding:0;margin:.8rem 0 0;max-height:360px;overflow:auto}.tl li{padding:.3rem 0;border-bottom:1px solid var(--line)}.tl b{margin:0 .3rem}
@media(max-width:1000px){.shell,.home{grid-template-columns:1fr}.stage{order:-1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><b>Roundtable</b><label class="row" style="margin:0">Reading mode <select id="theme" style="width:auto"><option value="sage">Sage</option><option value="paper">Paper</option><option value="dusk">Dusk</option></select></label></header>
<main id="app"></main><div id="toasts" aria-live="polite"></div>
<script>
const $=(s,e=document)=>e.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ws,me={role:null,id:null},S=null,key='',speaking=false,speakAt=0,rec=null,lastInv=null,local=null,mic=true,cam=true,lastV=0,retry=0;
let mediaReady=false,readyRes;const ready=new Promise(r=>readyRes=r);
const streams={},pcs={},audios={},rq={},bit={},prev={lost:0,recv:0,bytes:0};
$('#theme').onchange=e=>document.documentElement.dataset.theme=e.target.value;
const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o)),hue=id=>[...String(id)].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7),cap=s=>s?s[0].toUpperCase()+s.slice(1):'Good';
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),6000)}
function speak(t){try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}catch{}}
function beep(){try{const c=new AudioContext(),o=c.createOscillator();o.frequency.value=520;o.connect(c.destination);o.start();o.stop(c.currentTime+.18)}catch{}}
const TABLE='<div class="table"><div class="disc"></div><div class="core"><svg viewBox="0 0 120 120"><circle class="strk" cx="60" cy="60" r="54" fill="none"/><circle class="sfil" cx="60" cy="60" r="54"/></svg><video class="spot" muted playsinline autoplay></video><div class="ctext"><h2></h2><p></p></div></div></div>';
function seats(t,ps,meId,spk,inv){const n=ps.length,sig=ps.map(p=>p.id).join()+meId;
 if(t.dataset.sig!==sig){t.dataset.sig=sig;t.querySelectorAll('.seat').forEach(e=>e.remove());const off=ps.findIndex(p=>p.id===meId);
  ps.forEach((p,i)=>{const k=off<0?i:(i-off+n)%n,a=(off<0?-Math.PI/2:Math.PI/2)+k*2*Math.PI/n,e=document.createElement('div');
   e.className='seat';e.dataset.id=p.id;e.style.cssText=`left:${50+41*Math.cos(a)}%;top:${50+41*Math.sin(a)}%;--h:${hue(p.id)}`;
   e.innerHTML='<div class="av"><video muted playsinline autoplay></video><svg viewBox="0 0 92 92"><circle class="trk" cx="46" cy="46" r="43"/><circle class="fil" cx="46" cy="46" r="43"/></svg><span></span><i class="net"></i><u class="hand"></u></div><b></b><em></em>';
   e.querySelector('span').textContent=p.name.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
   e.querySelector('b').textContent=p.id===meId?p.name+' (you)':p.name;t.appendChild(e)})}
 ps.forEach(p=>{const e=t.querySelector(`[data-id="${p.id}"]`),st=streams[p.id],v=e.querySelector('video');e.classList.toggle('on',p.id===spk);e.classList.toggle('inv',p.id===inv);
  e.querySelector('.fil').style.strokeDashoffset=270.2*(1-Math.min(1,p.share*n));
  const vid=!!(st&&p.cam&&p.online!==false);e.querySelector('.av').classList.toggle('vid',vid);if(v.srcObject!==(st||null))v.srcObject=st||null;
  e.querySelector('.net').className='net '+(p.online===false?'off':p.q||'good');e.querySelector('.hand').textContent=p.hand?'✋'+p.hand:'';
  e.querySelector('em').textContent=(p.id===spk?'Speaking':p.id===inv?(p.id===meId?'Your turn':'Invited'):p.talkSeconds+'s')+(p.mic===false?' · muted':'')+(p.online===false?' · offline':'')})}
function core(t,h,s,frac,pulse){const c=t.querySelector('.core');c.classList.toggle('pulse',!!pulse);c.querySelector('h2').textContent=h;c.querySelector('p').textContent=s;if(!pulse)c.querySelector('.sfil').style.strokeDashoffset=339.3*(1-Math.min(1,frac))}
function spot(t,p){const c=t.querySelector('.core'),v=c.querySelector('.spot'),st=p&&streams[p.id],on=!!(p&&st&&p.cam&&p.online);c.classList.toggle('hasvid',on);const w=on?st:null;if(v.srcObject!==w)v.srcObject=w}
/* ---------- connection with auto-reconnect ---------- */
function connect(first){clearTimeout(connect.t);ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}`);
 ws.onopen=()=>{retry=0;first?first():me.joined&&send(me.role==='admin'?{type:'admin_join',code:me.code,jwt:me.jwt}:{type:'join',code:me.code,name:me.name,id:me.id,token:me.token})};
 ws.onmessage=e=>on(JSON.parse(e.data));
 ws.onclose=()=>{if(!me.role)return;toast('Connection lost. Reconnecting…');connect.t=setTimeout(()=>connect(),Math.min(8000,500*2**retry++))}}
function on(m){
 if(m.type==='joined'){Object.assign(me,{id:m.id,code:m.code,token:m.token,joined:true,mode:m.media});if(m.media==='livekit')sendMedia();else if(me.role==='p'){if(!local&&!me.media){me.media=1;startMedia()}else sendMedia()}else{mediaReady=true;readyRes()}}
 else if(m.type==='state'){if(S&&m.state.code===S.code&&m.state.v<lastV)return;lastV=m.state.v;S=m.state;update()}
 else if(m.type==='rtc')onRtc(m.from,m.data);
 else if(m.type==='lk')lkConnect(m.url,m.token);
 else if(m.type==='announce'){toast(m.text);speak(m.text)}
 else if(m.type==='notice'){toast(m.text);if(m.level==='poor'&&cam)tcam(false)}
 else if(m.type==='alert')toast(`${m.name}: connection ${m.level}`);
 else if(m.type==='error'){alert(m.message);if(!me.joined){me.role=null;ws.close()}}}
/* ---------- media ---------- */
async function startMedia(){try{local=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:{width:{ideal:640},height:{ideal:480},frameRate:{ideal:24}}})}
 catch{try{local=await navigator.mediaDevices.getUserMedia({audio:true})}catch{local=null;toast('Camera and microphone are blocked. You can still type points.')}}
 mic=!!local?.getAudioTracks().length;cam=!!local?.getVideoTracks().length;streams[me.id]=local;mediaReady=true;readyRes();sendMedia();if(S)update()}
const sendMedia=()=>send({type:'media',mic,cam});
function tmic(){if(lkRoom){mic=!mic;sendMedia();return}if(!local)return;mic=!mic;local.getAudioTracks().forEach(t=>t.enabled=mic);sendMedia()}
function tcam(v){if(lkRoom){cam=v??!cam;lkRoom.localParticipant.setCameraEnabled(cam).then(refreshLocal).catch(()=>{});sendMedia();return}if(!local?.getVideoTracks().length)return;cam=v??!cam;local.getVideoTracks().forEach(t=>t.enabled=cam);sendMedia()}
const offerer=(a,b)=>b==='admin'?true:a==='admin'?false:a<b;
function ensurePeers(){if(!S||!me.joined||!mediaReady||me.mode==='livekit'||S.status==='ended')return;const admin=me.role==='admin',want=S.participants.filter(p=>p.online&&p.id!==me.id).map(p=>p.id);if(!admin&&S.adminOnline)want.push('admin');
 want.forEach(id=>{if(!pcs[id]&&offerer(me.id,id))mk(id,true)});Object.keys(pcs).forEach(id=>{if(!want.includes(id)){pcs[id].close();delete pcs[id]}})}
function mk(id,isOfferer){const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pcs[id]=pc;streams[id]=new MediaStream();bit.k=null;
 if(isOfferer)for(const kind of ['audio','video']){const t=local?.getTracks().find(x=>x.kind===kind);pc.addTransceiver(t||kind,{direction:'sendrecv',streams:local?[local]:[]})}
 pc.onicecandidate=e=>e.candidate&&send({type:'rtc',to:id,data:{c:e.candidate}});
 pc.ontrack=e=>{streams[id]=new MediaStream([...streams[id].getTracks(),e.track]);if(e.track.kind==='audio'){let a=audios[id];if(!a){a=audios[id]=document.createElement('audio');a.autoplay=true;document.body.appendChild(a)}if(a.srcObject!==streams[id])a.srcObject=streams[id];a.muted=S?.speaker!==id}if(S)paint()};
 pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState)&&pcs[id]===pc){delete pcs[id];try{pc.close()}catch{}}};
 if(isOfferer)pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>send({type:'rtc',to:id,data:{sdp:pc.localDescription}}));return pc}
function onRtc(from,d){rq[from]=(rq[from]||Promise.resolve()).then(async()=>{await ready;const pc=pcs[from]||mk(from,false);
 if(d.sdp){await pc.setRemoteDescription(d.sdp);if(d.sdp.type==='offer'){pc.getTransceivers().forEach(tr=>{const t=local?.getTracks().find(x=>x.kind===tr.receiver.track.kind);if(t){tr.direction='sendrecv';tr.sender.replaceTrack(t)}});await pc.setLocalDescription(await pc.createAnswer());send({type:'rtc',to:from,data:{sdp:pc.localDescription}})}}
 else if(d.c){try{await pc.addIceCandidate(d.c)}catch{}}}).catch(()=>{})}
function adapt(){const q=S.participants.find(p=>p.id===me.id)?.q,target=q==='poor'?60e3:me.id===S.speaker?900e3:150e3,sc=q==='poor'?2:1,k=target+'/'+sc;if(bit.k===k)return;bit.k=k;
 for(const pc of Object.values(pcs))pc.getSenders().forEach(async s=>{if(s.track?.kind!=='video')return;try{const pr=s.getParameters();pr.encodings=pr.encodings?.length?pr.encodings:[{}];pr.encodings[0].maxBitrate=target;pr.encodings[0].scaleResolutionDownBy=sc;await s.setParameters(pr)}catch{}})}
async function diag(){if(lkRoom&&me.role==='p'){const m={excellent:[40,0],good:[120,.01],poor:[450,.05],lost:[900,.2]}[lkRoom.localParticipant.connectionQuality];if(m)send({type:'net',rtt:m[0],loss:m[1]});return}const pl=Object.values(pcs);if(!me.joined||!pl.length)return;let rtt=null,lost=0,recv=0,bytes=0;
 for(const pc of pl){try{(await pc.getStats()).forEach(r=>{if(r.type==='candidate-pair'&&r.nominated&&r.currentRoundTripTime!=null)rtt=Math.max(rtt??0,r.currentRoundTripTime*1000);if(r.type==='inbound-rtp'){lost+=Math.max(0,r.packetsLost||0);recv+=r.packetsReceived||0}if(r.type==='outbound-rtp')bytes+=r.bytesSent||0})}catch{}}
 const dl=lost-prev.lost,dr=recv-prev.recv,loss=dl>=0&&dr>=0&&dl+dr>0?dl/(dl+dr):0;Object.assign(prev,{lost,recv,bytes});send({type:'net',rtt,loss})}
setInterval(diag,2000);setInterval(()=>{if(S)ensurePeers()},3000);
/* ---------- LiveKit SFU (used when the server provides LIVEKIT_URL) ---------- */
let lkRoom=null,lkBusy=false,lkMicOn=false,lastVoice=0;const EOT_MS=8000;
async function lkConnect(url,token){if(lkRoom||lkBusy)return;lkBusy=true;
 if(!window.LivekitClient)await new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='/vendor/livekit-client.umd.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
 const L=window.LivekitClient,r=new L.Room({adaptiveStream:true,dynacast:true,videoCaptureDefaults:{resolution:L.VideoPresets.h360.resolution},audioCaptureDefaults:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
 r.on(L.RoomEvent.TrackSubscribed,(track,pub,p)=>{const id=p.identity;streams[id]=new MediaStream([...(streams[id]?.getTracks()||[]).filter(t=>t!==track.mediaStreamTrack),track.mediaStreamTrack]);
  if(track.kind==='audio'){let a=audios[id];if(!a){a=audios[id]=document.createElement('audio');a.autoplay=true;document.body.appendChild(a)}a.srcObject=new MediaStream([track.mediaStreamTrack])}if(S)paint()});
 r.on(L.RoomEvent.TrackUnsubscribed,(track,pub,p)=>{streams[p.identity]=new MediaStream((streams[p.identity]?.getTracks()||[]).filter(t=>t!==track.mediaStreamTrack));if(S)paint()});
 r.on(L.RoomEvent.ActiveSpeakersChanged,sp=>{if(sp.some(x=>x.isLocal))lastVoice=Date.now()});
 await r.connect(url,token);lkRoom=r;
 if(me.role==='p'){try{await r.localParticipant.setCameraEnabled(true);cam=true}catch{cam=false;toast('Camera is blocked. You can still type points.')}mic=true;refreshLocal()}
 mediaReady=true;readyRes();sendMedia();if(S)update()}
function refreshLocal(){const pub=lkRoom?.localParticipant.getTrackPublication(window.LivekitClient.Track.Source.Camera),t=pub?.track?.mediaStreamTrack;streams[me.id]=t?new MediaStream([t]):null;if(S)paint()}
function lkMic(){if(!lkRoom||me.role!=='p'||!S)return;const want=S.speaker===me.id&&mic;if(want===lkMicOn){lkMic.fail=0;return}lkMicOn=want;
 lkRoom.localParticipant.setMicrophoneEnabled(want).catch(()=>{lkMicOn=!want;if(want&&(lkMic.fail=(lkMic.fail||0)+1)<10)setTimeout(()=>S&&lkMic(),500)})}
setInterval(()=>{if(lkRoom&&speaking&&S?.speaker===me.id&&Date.now()-Math.max(lastVoice,speakAt)>EOT_MS){toggleFloor();toast('Your turn ended after a pause. Press Speak to continue.')}},1000); // end-of-turn detection
/* ---------- screens ---------- */
function home(){const demo=[['Aarav',.34],['Meera',.2],['Rohan',0],['Diya',.12],['Kabir',.2],['Ananya',.14]].map(([name,share],i)=>({id:'d'+i,name,share,talkSeconds:Math.round(share*60)}));
 $('#app').innerHTML=`<div class="home"><div><h1>Group discussions where everyone gets a turn.</h1><p class="muted">Join with camera and microphone. The speaker takes the centre of the table. Raise a hand to add something, and if the room goes quiet for 3 seconds, the AI invites whoever has spoken least.</p>
 <div class="tabs"><button id="tj" class="on" onclick="tab('join')">Join a discussion</button><button id="th" onclick="tab('host')">Host one</button></div>
 <div class="card panel on" id="pj"><label>Your name</label><input id="name"><label>Room code</label><input id="code" maxlength="4" style="text-transform:uppercase"><p></p><button onclick="joinRoom()">Take a seat</button></div>
 <div class="card panel" id="ph"><label>Admin email</label><input id="em" autocomplete="username"><label>Password</label><input id="key" type="password" autocomplete="current-password"><label>Topic</label><input id="topic" placeholder="e.g. Should AI-generated content be regulated?"><label>Key concepts to listen for, separated by commas</label><input id="kws"><p></p><button onclick="create()">Create discussion</button></div></div>
 <div>${TABLE}</div></div>`;const t=$('.table');seats(t,demo,'d3','d0','d2');core(t,'Rohan, your turn','Raised hand',1,true)}
function tab(w){for(const [a,b] of [['j','join'],['h','host']]){$('#p'+a).classList.toggle('on',b===w);$('#t'+a).classList.toggle('on',b===w)}}
async function create(){const res=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:$('#em').value,password:$('#key').value})}),j=await res.json();if(!res.ok)return alert(j.error||'Sign-in failed');Object.assign(me,{role:'admin',jwt:j.jwt});connect(()=>send({type:'create',jwt:me.jwt,topic:$('#topic').value,keywords:$('#kws').value.split(',').map(s=>s.trim()).filter(Boolean)}))}
function joinRoom(){Object.assign(me,{role:'p',name:$('#name').value});const c=$('#code').value;connect(()=>send({type:'join',name:me.name,code:c}))}
function toggleFloor(){speaking=!speaking;speakAt=Date.now();if(speaking&&!mic)tmic();send({type:speaking?'speak_start':'speak_stop'});stt(speaking)}
function stt(onn){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(onn&&SR){rec=new SR();rec.continuous=true;rec.lang=navigator.language||'en-US';rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)send({type:'speech',text:e.results[i][0].transcript})};rec.onend=()=>{if(speaking)try{rec.start()}catch{}};try{rec.start()}catch{}}
 else if(rec){const r=rec;rec=null;r.stop()}}
function addPoint(){const i=$('#txt');if(i.value.trim()){send({type:'speech',text:i.value});i.value=''}}
function tHand(){send({type:S.participants.find(p=>p.id===me.id)?.hand?'hand_lower':'hand_raise'})}
function update(){const k=me.role+S.status;if(k!==key){key=k;mount()}paint();ensurePeers()}
function mount(){const admin=me.role==='admin',ended=S.status==='ended';
 const side=admin?`<div class="muted">Room code</div><div class="code">${S.code}</div><p class="muted">Share this code. Participants take a seat when they join.</p><button id="go" style="width:100%"></button><div class="stat" style="margin-top:1rem"><span>Weak connections</span><b id="s5">0</b></div><h3 style="margin-top:1.2rem">Key concepts</h3><div class="chips">${(S.keywords||[]).map(k=>`<span>${esc(k)}</span>`).join('')||'<span class="muted">None set</span>'}</div>`
 :`<h3>Your session</h3><div class="stat"><span>Speaking time</span><b id="s1">0s</b></div><div class="stat"><span>Turns taken</span><b id="s2">0</b></div><div class="stat"><span>AI invitations</span><b id="s3">0</b></div><div class="stat"><span>Connection</span><b id="s4">Good</b></div>`;
 const dock=admin||ended?'':`<div class="dock"><button id="bm" class="ghost" onclick="tmic()"></button><button id="bc" class="ghost" onclick="tcam()"></button><button id="spk" onclick="toggleFloor()">Speak</button><button id="hand" class="ghost" onclick="tHand()">Raise hand</button></div><div class="dock"><input id="txt" placeholder="No mic? Type your point" onkeydown="if(event.key==='Enter')addPoint()"><button class="ghost" onclick="addPoint()">Add point</button></div><p class="hint" id="hint"></p>`;
 $('#app').innerHTML=`<div class="shell"><aside class="card">${side}<p class="legend" style="margin-top:1.2rem">The ring around each seat fills as that person reaches a fair share of the talking time. The dot shows connection quality.</p></aside>
 <section class="stage"><div class="th"><h1></h1><span class="pill"></span></div>${TABLE}${dock}</section><aside class="card feed"><h3>Points raised</h3><ol id="feed"></ol></aside></div><section class="rep" id="rep"></section><section class="rep" id="tr"></section>`;
 $('.th h1').textContent=S.topic;const g=$('#go');if(g)g.onclick=()=>send({type:S.status==='live'?'end':'start'})}
const fmt=t=>{const s=Math.max(0,Math.round((t-S.startedAt)/1000));return `[${String(s/60|0).padStart(2,'0')}:${String(s%60).padStart(2,'0')}]`};
function dlT(mine){const L=[`Topic: ${S.topic}`,`Room: ${S.code}`,''].concat(S.transcript.filter(x=>!mine||x.id===me.id).map(x=>`${fmt(x.t)} ${x.name}: ${x.text}`)),a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([L.join('\n')],{type:'text/plain'}));a.download=`transcript-${S.code}${mine?'-mine':''}.txt`;a.click()}
function paint(){const live=S.status==='live',ended=S.status==='ended',admin=me.role==='admin',ps=S.participants,spk=ps.find(p=>p.id===S.speaker),inv=ps.find(p=>p.id===S.invitedId),mine=ps.find(p=>p.id===me.id),t=$('.table');
 $('.pill').textContent=live?'Live':ended?'Finished':'Lobby';seats(t,ps,me.id,S.speaker,S.invitedId);
 if(inv&&inv.id!==lastInv&&inv.id===me.id)beep();lastInv=inv?inv.id:null;
 if(!live&&!ended)core(t,'Waiting to start','The host begins when everyone is seated',0);else if(ended)core(t,'Finished','Your transcript is below',0);
 else if(spk)core(t,spk.name,'has the floor',0);else if(inv)core(t,inv.id===me.id?'Your turn':inv.name+', your turn',inv.hand?'Raised their hand':'The AI invited the quietest voice',1,true);
 else core(t,'Floor open','AI invites someone in '+Math.max(0,Math.ceil((S.silenceLimit-S.silentMs)/1000))+'s',S.silentMs/S.silenceLimit);
 spot(t,spk);for(const id in audios)audios[id].muted=id!==S.speaker;
 const g=$('#go');if(g){g.textContent=live?'End and evaluate':'Start discussion';g.disabled=ended||(!live&&!ps.length);g.style.display=ended?'none':''}
 if(mine){$('#s1').textContent=mine.talkSeconds+'s';$('#s2').textContent=mine.turns;$('#s3').textContent=mine.invites;$('#s4').textContent=cap(mine.q)}
 const w=$('#s5');if(w)w.textContent=ps.filter(p=>p.online&&p.q!=='good').length;
 const sp=$('#spk');if(sp){const other=S.speaker&&S.speaker!==me.id;sp.disabled=!live||other;sp.textContent=S.speaker===me.id?'Finish speaking':'Speak';
  $('#bm').textContent=mic?'Mic on':'Mic off';$('#bc').textContent=cam?'Camera on':'Camera off';$('#bm').disabled=!(local||lkRoom);$('#bc').disabled=lkRoom?false:!local?.getVideoTracks().length;
  const h=mine?.hand;$('#hand').textContent=h?`Lower hand (#${h})`:'Raise hand';$('#hand').disabled=!live||S.speaker===me.id;
  $('#hint').textContent=!live?'Waiting for the host to start.':S.speaker===me.id?(mic?'You have the floor. Everyone can see and hear you.':'You have the floor, but your mic is off.'):other?spk.name+' has the floor. Raise your hand to add something.':inv&&inv.id===me.id?"It's your turn. Press Speak.":'The floor is open. Press Speak.';
  if(speaking&&S.speaker!==me.id&&Date.now()-speakAt>1500){speaking=false;stt(false)}}
 const f=$('#feed'),fs=S.feed.length+(S.feed.at(-1)?.text||'');if(f.dataset.s!==fs){f.dataset.s=fs;f.innerHTML='';S.feed.forEach(x=>{const li=document.createElement('li');li.innerHTML='<b></b><span></span>';li.firstChild.textContent=x.name;li.lastChild.textContent=x.text;f.appendChild(li)});if(!S.feed.length)f.innerHTML='<li class="muted">Points appear here as people speak.</li>'}
 const r=$('#rep');if(S.report&&!r.dataset.d){r.dataset.d=1;r.innerHTML=S.report.map(x=>`<div class="card"><div class="row"><div class="score" style="--v:${x.overall}"><b>${x.overall}</b></div><div><h3 style="margin:0">${esc(x.name)}</h3><span class="muted">${x.talkSeconds}s · ${x.turns} turns · ${x.invites} invited · relevance ${x.relevance}</span></div></div><div style="margin-top:.8rem">Participation ${x.participation}<div class="meter"><i style="width:${x.participation}%"></i></div>Knowledge ${x.knowledge}<div class="meter"><i style="width:${x.knowledge}%"></i></div><span class="muted">${esc(x.feedback)}</span></div></div>`).join('')}
 const tr=$('#tr');if(S.transcript&&!tr.dataset.d){tr.dataset.d=1;tr.innerHTML='<div class="card"><h2>Meeting transcript</h2><p class="muted">Recorded for everyone who took part. Download your copy.</p><div class="row"><button onclick="dlT(0)">Download full transcript</button>'+(admin?'':'<button class="ghost" onclick="dlT(1)">Download my transcript</button>')+'</div><ol class="tl"></ol></div>';
  const ol=$('.tl',tr);S.transcript.forEach(x=>{const li=document.createElement('li');li.innerHTML='<span class="muted"></span> <b></b><span></span>';const s=li.children;s[0].textContent=fmt(x.t);s[1].textContent=x.name+':';s[2].textContent=' '+x.text;ol.appendChild(li)});if(!S.transcript.length)ol.innerHTML='<li class="muted">Nobody spoke during this session.</li>'}
 adapt();lkMic()}
home();
</script></body></html>
