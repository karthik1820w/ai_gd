services:
  app:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://gd:${POSTGRES_PASSWORD}@db:5432/gd
      REDIS_URL: redis://redis:6379
      LIVEKIT_URL: ws://livekit:7880
    depends_on: [db, redis, livekit]
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: gd, POSTGRES_DB: gd, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}" }
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    environment: { LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}" }
    volumes: ["./livekit.yaml:/etc/livekit.yaml:ro"]
    ports: ["7880:7880", "7881:7881", "7882:7882/udp", "3478:3478/udp"]
volumes: { pgdata: {}, redisdata: {} }
