name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://quorum:quorum@localhost:5432/quorum_ci
      JWT_SECRET: ci-only-session-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck application and server
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build production app
        run: npm run build
