name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AI_GD/package-lock.json
      - name: Install dependencies
        working-directory: AI_GD
        run: npm ci
      - name: Typecheck application and server
        working-directory: AI_GD
        run: npm run typecheck
      - name: Run unit tests
        working-directory: AI_GD
        run: npm test
      - name: Build production app
        working-directory: AI_GD
        run: npm run build
        env:
          DATABASE_URL: file:./dev.db
          JWT_SECRET: ci-only-session-secret-not-for-production
