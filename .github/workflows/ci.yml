name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quorum:
    name: AI_GD typecheck, tests, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AI_GD/package-lock.json
      - run: npm ci
        working-directory: AI_GD
      - run: npm run typecheck
        working-directory: AI_GD
      - run: npm test
        working-directory: AI_GD
      - run: npm run build
        working-directory: AI_GD
